[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="typemoonaddon"
description='''
An independent Type Moon World addon featuring Imaginary Storage magic and Imaginary Space.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},1.22)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="typemoonworld"
type="required"
# Keep the addon loadable across future Type Moon World releases.
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[4.9.2,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="[4.1.0.8,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="optional"
versionRange="[21.17.3.1,)"
ordering="AFTER"
side="BOTH"
