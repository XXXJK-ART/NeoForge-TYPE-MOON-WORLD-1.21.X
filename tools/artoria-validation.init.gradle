// Isolated verification outputs; does not alter another local validation run.
allprojects {
    layout.buildDirectory = file('build/artoria-verification')
    afterEvaluate { project ->
        project.runs.gameTestServer.workingDirectory project.file('build/artoria-gametest-run')
        project.tasks.named('test').configure { inputs.dir project.file('src/main/resources') }
    }
}
