// Optional client/dedicated smoke fixture, never packaged in the mod.
allprojects {
    afterEvaluate { project ->
        def smoke = project.sourceSets.create('zhaoYunSmoke') {
            java.srcDir 'tools/zhao-yun-smoke/java'
            resources.srcDir 'tools/zhao-yun-smoke/resources'
            compileClasspath += project.sourceSets.main.output + project.configurations.compileClasspath
            runtimeClasspath += project.sourceSets.main.output + project.configurations.runtimeClasspath
        }
        project.runs.client.modSources.add('typemoonworld_zhao_yun_smoke', smoke)
        project.runs.server.modSources.add('typemoonworld_zhao_yun_smoke', smoke)
        project.runs.client.workingDirectory project.file('build/zhao-yun-client-run')
        project.runs.server.workingDirectory project.file('build/zhao-yun-server-run')
    }
}
